name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.3.5 Pillow==12.3.0 opencv-python==5.0.0.93
      # SciPy enables the Hungarian person association in trailcam/events.py (the
      # greedy fallback is tested either way). SciPy 1.18 needs Python >= 3.12.
      - run: python -m pip install "scipy==1.18.1; python_version >= '3.12'" "scipy>=1.16,<1.19; python_version < '3.12'"
      - run: python -m unittest discover -s tests -v
